<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* body {
            font-family: serif; 
            font-size: 16px;
            background-color: #ffffff;
            margin: 20px;
        } */

        fieldset {
            border: 1px solid #b5b5b5; 
            padding: 20px 25px;
            max-width: 500px; 
            border-radius: 2px;
        }

        /* legend {
            font-size: 18px;
            padding: 0 5px;
        } */

        .form-group {
            margin-bottom: 7px;
            display: flex;
            align-items: center;
        }

        label {
            width: 90px; 
            display: inline-block;
        }

        .checkbox-group {
            margin-bottom: 10px;
            display: flex;
            align-items: center;
        }

        .checkbox-group input {
            margin-right: 8px;
        }

        button[type="submit"] {
            margin-left: 0;
            padding: 3px 12px;
            
        } 
    </style>
</head>
<body>
    <form action="info.html" method="get">
    <fieldset>
        <legend>Login</legend>
        
        <div class="form-group">
            <label for="username">Username:</label>
            <input type="text">
        </div>
        
        <div class="form-group">
            <label for="password">Password:</label>
            <input type="password">
        </div>
        
        <div class="checkbox-group">
            <input type="checkbox">
            <label for="remember" style="width: auto;">Remember me</label>
        </div>
        
        <button type="submit">Login</button>
    </fieldset>
</form>

</body>
</html>
